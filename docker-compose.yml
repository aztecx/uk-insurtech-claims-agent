services:
  # 1. Ollama AI Service (Runs the model fully inside Docker)
  ollama:
    image: ollama/ollama:latest
    container_name: insurtech_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  
    # One-time model downloader
  ollama-pull:
    image: ollama/ollama:latest
    container_name: insurtech_model_pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5:3b"]
    restart: "no"

  # 2. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insurtech_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insurtech_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/claims/process
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: